name: 生徒のパスワード再発行

# 先生がアプリで「パスワード再発行」を押すと受付票ができる。それを10分ごとに処理する。
# 急ぐときは Actions タブでこのワークフローを選び「Run workflow」を押すと、すぐに処理される。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: password-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: サービスアカウントの鍵を用意
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::GitHub の Secrets に FIREBASE_SERVICE_ACCOUNT が未登録です。"
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 受付票を処理
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        working-directory: scripts
        run: |
          npm ci --no-audit --no-fund --silent
          node reset-passwords.js
