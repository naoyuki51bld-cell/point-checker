name: Firebase にデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: サービスアカウントの鍵を用意
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::GitHub の Secrets に FIREBASE_SERVICE_ACCOUNT が未登録のため、デプロイを省略しました（README 参照）。"
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Hosting（サイト本体）をデプロイ
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only hosting --project point-check-9ca84 --non-interactive 2>&1 | tee "$RUNNER_TEMP/hosting.log" || {
            tail -n 25 "$RUNNER_TEMP/hosting.log" | sed 's/^/::error title=Hosting のデプロイに失敗::/'
            exit 1
          }

      - name: Firestore ルールをデプロイ
        if: always() && env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only firestore:rules --project point-check-9ca84 --non-interactive 2>&1 | tee "$RUNNER_TEMP/firestore.log" || {
            tail -n 25 "$RUNNER_TEMP/firestore.log" | sed 's/^/::error title=Firestore ルールのデプロイに失敗::/'
            exit 1
          }
