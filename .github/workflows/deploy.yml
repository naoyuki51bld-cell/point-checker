name: Firebase にデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: サービスアカウントの鍵を用意
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::GitHub の Secrets に FIREBASE_SERVICE_ACCOUNT が未登録のため、デプロイを省略しました（README 参照）。"
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # 既存のデータは削除・上書きしない。変換が必要なときだけ、先に Firestore 内へバックアップを取る。
      # 失敗したらここで止まり、新しいアプリとルールは公開されない（今のアプリがそのまま動き続ける）。
      - name: データのバックアップと変換
        id: migrate
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        working-directory: scripts
        run: |
          npm ci --no-audit --no-fund
          node migrate-classes.js || { echo "::error title=データの変換に失敗::デプロイを中止しました。データは変更されていないか、バックアップが backups コレクションにあります。"; exit 1; }

      - name: Hosting（サイト本体）と Firestore ルールをデプロイ
        if: env.GOOGLE_APPLICATION_CREDENTIALS != '' && steps.migrate.outcome == 'success'
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project point-check-9ca84 --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log" || {
            tail -n 25 "$RUNNER_TEMP/deploy.log" | sed 's/^/::error title=デプロイに失敗::/'
            exit 1
          }
